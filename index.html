<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stroma Health — Dr. Brady Murphy</title>
  <meta name="description" content="Stroma is a FHIR-native EMR for primary care, built by a practising Manitoba family physician. Save Dr. Brady Murphy's contact.">
  <meta name="theme-color" content="#0f3d3a">
  <meta property="og:title" content="Stroma Health — Dr. Brady Murphy">
  <meta property="og:description" content="A FHIR-native EMR for primary care, built by a practising Manitoba family physician.">
  <meta property="og:url" content="https://stromahealth.ca/">
  <meta property="og:type" content="website">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #f6f4ef;
      --surface: #ffffff;
      --ink: #14211f;
      --muted: #5f6b68;
      --line: #e2ddd3;
      --brand: #0f3d3a;
      --brand-ink: #ffffff;
      --accent: #2f8f83;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1514;
        --surface: #15201f;
        --ink: #e9efed;
        --muted: #9fb0ac;
        --line: #26332f;
        --brand: #5cc2b4;
        --brand-ink: #062320;
        --accent: #5cc2b4;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      display: flex;
      background: var(--bg);
      color: var(--ink);
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 26rem;
      margin: auto;
      padding: max(2.5rem, env(safe-area-inset-top)) 1rem max(2.5rem, env(safe-area-inset-bottom));
      text-align: center;
    }
    .mark { width: 64px; height: 64px; color: var(--brand); display: block; margin: 0 auto 1.25rem; }
    h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 .3rem; letter-spacing: -.01em; }
    .role { color: var(--muted); margin: 0 0 2rem; font-size: .98rem; }
    .save {
      display: flex; align-items: center; justify-content: center; gap: .6rem;
      width: 100%; min-height: 3.75rem; padding: 1rem;
      background: var(--brand); color: var(--brand-ink);
      border-radius: 999px; text-decoration: none;
      font-size: 1.15rem; font-weight: 650;
      box-shadow: 0 8px 20px -10px rgba(15, 61, 58, .6);
    }
    .save:active, .links a:active { transform: translateY(1px); }
    .save svg { width: 22px; height: 22px; }
    .save:focus-visible, .links a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .links { list-style: none; margin: 1rem 0 0; padding: 0; display: grid; gap: .75rem; }
    .links a {
      display: flex; align-items: center; justify-content: center;
      min-height: 3.25rem; padding: .8rem 1rem;
      background: var(--surface); color: var(--ink);
      border: 1px solid var(--line); border-radius: 999px;
      text-decoration: none; font-weight: 550;
    }
    .tagline { margin: 2.5rem 0 0; color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 32 32" role="img" aria-label="Stroma Health">
      <rect width="32" height="32" rx="8" fill="currentColor"/>
      <path d="M7 11q4.5-3 9 0t9 0M7 16q4.5-3 9 0t9 0M7 21q4.5-3 9 0t9 0" stroke="var(--bg)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </svg>

    <h1>Dr. Brady Murphy</h1>
    <p class="role">Family physician · Founder, Stroma Health</p>

    <a class="save" href="brady-murphy.vcf" download="Brady-Murphy.vcf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="10" cy="8" r="4"/><path d="M2 21c0-4 3.6-7 8-7"/><path d="M18 14v7M14.5 17.5h7"/>
      </svg>
      Save contact
    </a>

    <ul class="links">
      <li><a href="mailto:brady@stromahealth.ca">Email</a></li>
      <!-- Add later:
      <li><a href="https://www.linkedin.com/in/REPLACE-ME" rel="noopener">LinkedIn</a></li>
      <li><a href="https://…">Watch the demo</a></li>
      <li><a href="https://…">Book a call</a></li>
      -->
    </ul>

    <p class="tagline">Stroma — a FHIR-native EMR for primary care.</p>
  </main>
</body>
</html>
