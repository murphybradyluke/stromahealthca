<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stroma physician survey</title>
  <meta name="description" content="A 2-minute survey for family physicians about the EMR you use now.">
  <meta name="theme-color" content="#f6f4ef">
  <meta property="og:title" content="Help shape a better EMR">
  <meta property="og:description" content="A 2-minute survey for family physicians about the EMR you use now.">
  <meta property="og:url" content="https://stromahealth.ca/survey/">
  <meta property="og:type" content="website">
  <link rel="icon" href="../favicon.svg?v=3" type="image/svg+xml">
  <style>
    :root {
      --bg: #f6f4ef;
      --ink: #14211f;
      --muted: #5f6b68;
      --accent: #2f8f83;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 40rem;
      margin: 0 auto;
      padding: max(2rem, env(safe-area-inset-top)) 1rem max(2rem, env(safe-area-inset-bottom));
    }
    .logo-link { display: block; width: 160px; margin: 0 auto 1.5rem; }
    .logo { width: 100%; height: auto; display: block; }
    h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 .4rem; letter-spacing: -.01em; text-align: center; }
    .lead { color: var(--muted); margin: 0 0 1.5rem; text-align: center; }
    iframe { display: block; width: 100%; border: 0; min-height: 600px; }
    .note { margin: 2rem 0 0; color: var(--muted); font-size: .85rem; text-align: center; }
    .note a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <a class="logo-link" href="../">
      <picture>
        <img src="../assets/logos/stroma-logo-light.svg" alt="Stroma Health" class="logo" width="300" height="156">
      </picture>
    </a>

    <h1>Help shape a better EMR</h1>
    <p class="lead">A 2-minute survey for family physicians about the EMR you use now. No patient information, please.</p>

    <!-- Tally form jebpAx (created via the Tally API, 2026-11-08) -->
    <iframe data-tally-src="https://tally.so/embed/jebpAx?alignLeft=1&amp;hideTitle=1&amp;transparentBackground=1&amp;dynamicHeight=1"
            loading="lazy" width="100%" height="600" title="Stroma physician survey"></iframe>
    <script>
      var d = document, w = "https://tally.so/widgets/embed.js";
      var v = function () {
        if (typeof Tally !== "undefined") { Tally.loadEmbeds(); }
        else { d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach(function (e) { e.src = e.dataset.tallySrc; }); }
      };
      if (typeof Tally !== "undefined") { v(); }
      else if (d.querySelector('script[src="' + w + '"]') == null) {
        var s = d.createElement("script"); s.src = w; s.onload = v; s.onerror = v; d.body.appendChild(s);
      }
    </script>

    <p class="note">Responses are anonymous unless you leave your email. We never sell your data or use it for advertising or targeting.<br>
      Questions: <a href="mailto:brady@stromahealth.ca">brady@stromahealth.ca</a></p>
  </main>
</body>
</html>
